name: Bug Report
description: Report a bug in CEMAF (Alpha)
title: "[Bug]: "
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! CEMAF is in Alpha - bugs are expected and appreciated.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug
      placeholder: "When I tried X, Y happened instead of Z..."
    validations:
      required: true

  - type: textarea
    id: code
    attributes:
      label: Code to reproduce (if you have it)
      render: python
      placeholder: |
        from cemaf import ...
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: CEMAF Version
      placeholder: "0.1.0"
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Anything else?
      placeholder: "Python version, OS, error logs, etc."
    validations:
      required: false
