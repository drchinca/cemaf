name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff check
        run: uv run ruff check src/cemaf/

      - name: Ruff format check
        run: uv run ruff format --check src/cemaf/

      - name: MyPy
        run: uv run mypy src/cemaf/

      - name: Bandit security scan
        run: uv run bandit -r src/cemaf/ -c pyproject.toml

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run unit tests with coverage
        run: uv run pytest tests/unit -v --tb=short --cov=src/cemaf --cov-report=term-missing --cov-report=xml

      - name: Check coverage threshold
        run: uv run pytest tests/unit --cov=src/cemaf --cov-fail-under=80 -q --no-header

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run integration tests
        run: uv run pytest tests/integration -v --tb=short

  build:
    name: Build & Verify Package
    runs-on: ubuntu-latest
    needs: [integration]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.14

      - name: Build wheel
        run: uv build

      - name: Verify package
        run: |
          uv run python -c "
          import zipfile, pathlib
          whl = list(pathlib.Path('dist').glob('*.whl'))[0]
          with zipfile.ZipFile(whl) as z:
              names = z.namelist()
              assert any('py.typed' in n for n in names), 'Missing py.typed'
              print(f'Package: {whl.name} ({len(names)} files)')
          "

      - name: Verify import
        run: |
          uv pip install dist/*.whl
          uv run python -c "from cemaf import create_executor, AgentRegistry, DAG; print(f'cemaf {__import__(\"cemaf\").__version__} OK')"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cemaf-wheel
          path: dist/*.whl

  benchmarks:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run benchmarks
        run: uv run python benchmarks/run_benchmarks.py
