[project]
name = "cemaf"
version = "2.3.0"
description = "Context Engineering Multi-Agent Framework - A pluggable, modular framework for building AI agent systems"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [
    { name = "Hikuri Bado Chinca", email = "chincadr@gmail.com" },
]
keywords = [
    "ai",
    "agents",
    "multi-agent",
    "context-engineering",
    "llm",
    "dag",
    "orchestration",
    "langchain",
    "langgraph",
    "autogen",
    "crewai",
    "context-management",
    "token-budgeting",
    "provenance",
    "replay",
    "framework-agnostic",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
    "Framework :: AsyncIO",
]

# =============================================================================
# CORE DEPENDENCIES - Minimal, framework-agnostic
# =============================================================================
dependencies = [
    "aiosqlite>=0.22.1",
    "pydantic>=2.0",
    "structlog>=25.5.0",
    "typing-extensions>=4.9",
]

# =============================================================================
# OPTIONAL DEPENDENCIES - Install only what you need
# =============================================================================
[project.optional-dependencies]
# Development tools
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.8",
    "ruff>=0.3",
    "bandit[toml]>=1.7",
    "pre-commit>=4.0",
    "fakeredis>=2.0",
]

# HTTP client for OpenAI-compat, Gemini, Groq, Together adapters
http = [
    "httpx>=0.27",
]

# Accurate token counting (OpenAI tokenizer)
tiktoken = [
    "tiktoken>=0.5",
]

# OpenAI integration
openai = [
    "openai~=2.14",
    "tiktoken>=0.5",
]

# Anthropic integration
anthropic = [
    "anthropic~=0.40",
]

# Hugging Face Hub integration
huggingface = [
    "huggingface_hub>=1.0",
]

# Vector store integrations
pinecone = [
    "pinecone-client>=3.0",
]

# Temporarily disabled - waiting for Python 3.14 wheel support
# chromadb = [
#     "chromadb>=0.4",
# ]

# SQLite persistent memory store (aiosqlite is already a core dep)
# Kept as extra for documentation - installs nothing additional

# Performance profiling tools
profiling = [
    "pytest-benchmark>=5.1.0",
    "memory-profiler>=0.61.0",
    "line-profiler>=4.2.0",
]

# Prometheus metrics
prometheus = [
    "prometheus-client>=0.20",
]

# OpenTelemetry tracing + metrics export (observability.otel_setup.configure_otel)
otel = [
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
]

# Web UI (architecture advisor)
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sse-starlette>=2.0",
]

# PostgreSQL memory store + pgvector
postgres = ["asyncpg>=0.30", "pgvector>=0.3"]

# Redis session store
redis = ["redis[asyncio]>=5.0"]

# Security layer: Ed25519 audit signing
security = ["cryptography>=42.0"]

# Security layer with YAML mapping support
security-yaml = ["cemaf[security]", "pyyaml>=6.0"]

# Convenience meta-extra: postgres + redis + security
enterprise = ["cemaf[postgres,redis,security]"]

# All optional integrations
all = [
    "tiktoken>=0.5",
    "openai~=2.14",
    "anthropic~=0.40",
    "huggingface_hub>=1.0",
    "prometheus-client>=0.20",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sse-starlette>=2.0",
]

[project.urls]
Homepage = "https://github.com/drchinca/cemaf"
Documentation = "https://github.com/drchinca/cemaf/blob/main/docs/README.md"
Repository = "https://github.com/drchinca/cemaf"
"Bug Tracker" = "https://github.com/drchinca/cemaf/issues"
"Discussions" = "https://github.com/drchinca/cemaf/discussions"
"Discord Community" = "https://discord.gg/C8ZXAbD8"
"Changelog" = "https://github.com/drchinca/cemaf/blob/main/CHANGELOG.md"
"Source Code" = "https://github.com/drchinca/cemaf"

[project.scripts]
cemaf = "cemaf.cli:main"

# =============================================================================
# BUILD SYSTEM
# =============================================================================
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cemaf"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/examples",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

# =============================================================================
# TOOL CONFIGURATION
# =============================================================================
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "unit: fast unit-level tests",
    "real_cli: tests that shell out to a real binary (openspec, etc); skipped if missing",
]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

# Ignore missing imports for optional dependencies that may not be installed
[[tool.mypy.overrides]]
module = [
    "tiktoken",
    "tiktoken.*",
    "websockets",
    "websockets.*",
    "aiohttp",
    "aiohttp.*",
    "prometheus_client",
    "prometheus_client.*",
    "anthropic",
    "anthropic.*",
    "openai",
    "openai.*",
    "huggingface_hub",
    "huggingface_hub.*",
    "pinecone",
    "pinecone.*",
    "asyncpg",
    "asyncpg.*",
    "pgvector",
    "pgvector.*",
    "redis",
    "redis.*",
    "fakeredis",
    "fakeredis.*",
    "cryptography",
    "cryptography.*",
    "yaml",
    "pydantic",
    "pydantic.*",
    "pydantic_core",
    "pydantic_core.*",
    "aiosqlite",
    "aiosqlite.*",
    "opentelemetry",
    "opentelemetry.*",
    "httpx",
    "httpx.*",
]
ignore_missing_imports = true

# Our own adapter modules that bridge to third-party libs whose shipped type
# stubs (openai>=2.14, redis>=5) are stricter than our dynamic-kwargs / mapping
# usage. The runtime is correct; the stubs reject patterns like **kwargs into an
# overloaded create() or dict[str,str] into redis xadd. Scoped per-module so the
# rest of these files stays fully type-checked.
[[tool.mypy.overrides]]
module = [
    "cemaf.llm.openai",
    "cemaf.events.redis_event_bus",
    "cemaf.resilience.redis_rate_limiter",
    "cemaf.resilience.redis_circuit_breaker",
]
disable_error_code = ["arg-type", "call-overload", "await-not-async", "misc"]

[tool.ruff]
target-version = "py314"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
# Ignore specific rules for code style preferences and test patterns
ignore = [
    "E402",      # Module level import not at top of file
    "B017",      # assertRaises(Exception) should be considered evil
    "N815",      # Variable in function should be lowercase
    "N818",      # Exception name should end in Error
    "SIM105",    # Use contextlib.suppress() instead of try-except-pass
    "SIM108",    # Use ternary operator instead of if-else
    "TC001",     # Move application import into TYPE_CHECKING block (replaces TCH001)
    "TC002",     # Move third-party import into TYPE_CHECKING block (replaces TCH002)
    "TC003",     # Move standard library import into TYPE_CHECKING block (replaces TCH003)
    "UP031",     # Use % formatting for lazy logging (required for performance)
]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv", "build", "dist", ".pytest_cache"]
skips = [
    "B101",  # Allow assert in tests
    "B404",  # subprocess import - used only for fixed system commands (sysctl, vm_stat)
    "B603",  # subprocess.run with fixed command list - no shell, no user input
    "B607",  # partial path - system commands (sysctl, vm_stat) with no user-controlled args
    "B608",  # SQL f-strings use asyncpg parameterized queries ($1,$2); only schema name is interpolated (controlled constructor arg, not user input)
]
tests = [
    "B201", "B301", "B302", "B303", "B304", "B305", "B306", "B307", "B308",
    "B310", "B311", "B312", "B313", "B314", "B315", "B316", "B317", "B318",
    "B319", "B320", "B321", "B323", "B324", "B325", "B401", "B402", "B403",
    "B405", "B406", "B407", "B408", "B409", "B410", "B411", "B412",
    "B413", "B501", "B502", "B503", "B504", "B505", "B506", "B507", "B508",
    "B509", "B601", "B602", "B604", "B605", "B606",
    "B609", "B610", "B611", "B612", "B701", "B702", "B703"
]

[dependency-groups]
dev = [
    "openai>=2.14.0",
    "pydantic[mypy]>=2.12.5",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
