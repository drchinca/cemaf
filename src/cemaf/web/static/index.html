<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CEMAF Architect</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css">
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/languages/python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/languages/bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/languages/json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/languages/yaml.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            surface: { 0: '#0a0a0a', 1: '#0f0f0f', 2: '#171717', 3: '#1f1f1f', 4: '#262626' },
            accent: { DEFAULT: '#3b82f6', hover: '#2563eb', glow: 'rgba(59,130,246,0.15)' },
            muted: '#737373',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['JetBrains Mono', 'Fira Code', 'SF Mono', 'Menlo', 'monospace'],
          },
        },
      },
    };
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    * { box-sizing: border-box; }

    body {
      background: #0a0a0a;
      color: #e5e5e5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Textarea auto-resize */
    #prompt-input {
      field-sizing: content;
      min-height: 120px;
      max-height: 320px;
      resize: none;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #444; }

    /* Markdown output styles */
    #output-content h1 { font-size: 1.5rem; font-weight: 700; margin: 1.5rem 0 0.75rem; color: #f5f5f5; }
    #output-content h2 { font-size: 1.25rem; font-weight: 600; margin: 1.25rem 0 0.5rem; color: #f5f5f5; border-bottom: 1px solid #262626; padding-bottom: 0.375rem; }
    #output-content h3 { font-size: 1.1rem; font-weight: 600; margin: 1rem 0 0.5rem; color: #e5e5e5; }
    #output-content p { margin: 0.5rem 0; line-height: 1.7; color: #d4d4d4; }
    #output-content ul, #output-content ol { margin: 0.5rem 0; padding-left: 1.5rem; }
    #output-content li { margin: 0.25rem 0; line-height: 1.6; color: #d4d4d4; }
    #output-content ul { list-style-type: disc; }
    #output-content ol { list-style-type: decimal; }
    #output-content strong { color: #f5f5f5; font-weight: 600; }
    #output-content code:not(pre code) {
      background: #1f1f1f;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      font-size: 0.875em;
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', monospace;
      color: #93c5fd;
    }
    #output-content pre {
      position: relative;
      margin: 0.75rem 0;
      border-radius: 8px;
      overflow: hidden;
    }
    #output-content pre code {
      display: block;
      padding: 1rem;
      overflow-x: auto;
      font-size: 0.85rem;
      line-height: 1.6;
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', monospace;
      background: #111;
      border: 1px solid #262626;
      border-radius: 8px;
    }
    #output-content blockquote {
      border-left: 3px solid #3b82f6;
      margin: 0.75rem 0;
      padding: 0.5rem 1rem;
      background: rgba(59, 130, 246, 0.05);
      border-radius: 0 6px 6px 0;
      color: #a3a3a3;
    }
    #output-content table { width: 100%; border-collapse: collapse; margin: 0.75rem 0; }
    #output-content th { text-align: left; padding: 0.5rem; border-bottom: 2px solid #262626; color: #f5f5f5; font-weight: 600; }
    #output-content td { padding: 0.5rem; border-bottom: 1px solid #1f1f1f; color: #d4d4d4; }

    /* Copy button on code blocks */
    .code-block-wrapper { position: relative; }
    .code-copy-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      padding: 4px 10px;
      font-size: 0.7rem;
      background: #262626;
      border: 1px solid #333;
      color: #a3a3a3;
      border-radius: 4px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s ease;
      z-index: 10;
      font-family: 'Inter', system-ui, sans-serif;
    }
    .code-block-wrapper:hover .code-copy-btn { opacity: 1; }
    .code-copy-btn:hover { background: #333; color: #e5e5e5; }

    /* Loading dots */
    @keyframes dot-pulse {
      0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1); }
    }
    .loading-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #3b82f6;
      margin: 0 3px;
    }
    .loading-dot:nth-child(1) { animation: dot-pulse 1.2s infinite 0s; }
    .loading-dot:nth-child(2) { animation: dot-pulse 1.2s infinite 0.2s; }
    .loading-dot:nth-child(3) { animation: dot-pulse 1.2s infinite 0.4s; }

    /* Fade in */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in-up { animation: fadeInUp 0.35s ease-out forwards; }

    /* Button glow */
    .btn-glow {
      box-shadow: 0 0 0 0 rgba(59, 130, 246, 0);
      transition: box-shadow 0.3s ease, background-color 0.2s ease, transform 0.1s ease;
    }
    .btn-glow:not(:disabled):hover {
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.25), 0 0 40px rgba(59, 130, 246, 0.1);
    }
    .btn-glow:not(:disabled):active { transform: scale(0.98); }

    /* Spinner */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    /* Example chips */
    .example-chip {
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }
    .example-chip:hover {
      background: #1f1f1f;
      border-color: #3b82f6;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="border-b border-surface-3 bg-surface-1/80 backdrop-blur-sm sticky top-0 z-50">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 py-4 flex items-center gap-3">
      <div class="text-2xl" aria-hidden="true">&#9889;</div>
      <div>
        <h1 class="text-lg sm:text-xl font-bold text-white tracking-tight">CEMAF Architect</h1>
        <p class="text-xs text-muted hidden sm:block">Describe a feature, get an architecture plan</p>
      </div>
    </div>
  </header>

  <!-- Main -->
  <main class="flex-1 max-w-3xl mx-auto w-full px-4 sm:px-6 py-6 sm:py-10 flex flex-col gap-6">

    <!-- Input Section -->
    <section>
      <label for="prompt-input" class="block text-sm font-medium text-neutral-300 mb-2">
        Describe your feature idea
      </label>
      <div class="relative">
        <textarea
          id="prompt-input"
          class="w-full bg-surface-2 text-neutral-100 border border-surface-4 rounded-lg px-4 py-3 text-sm leading-relaxed placeholder:text-neutral-600 focus:outline-none focus:ring-2 focus:ring-accent/50 focus:border-accent transition-colors"
          placeholder="e.g., 'Add a caching layer for LLM responses' or 'Build a webhook notification system'"
          spellcheck="false"
        ></textarea>
        <span id="char-count" class="absolute bottom-2 right-3 text-xs text-neutral-600 tabular-nums pointer-events-none">0</span>
      </div>

      <!-- Example prompts -->
      <div class="mt-3 flex flex-wrap gap-2">
        <button class="example-chip text-xs px-3 py-1.5 rounded-full border border-surface-4 text-neutral-400 bg-surface-2 cursor-pointer" data-prompt="Add a caching layer for LLM responses with TTL and cache invalidation">
          Caching layer
        </button>
        <button class="example-chip text-xs px-3 py-1.5 rounded-full border border-surface-4 text-neutral-400 bg-surface-2 cursor-pointer" data-prompt="Build a webhook notification system for agent events with retry and dead letter queue">
          Webhook notifications
        </button>
        <button class="example-chip text-xs px-3 py-1.5 rounded-full border border-surface-4 text-neutral-400 bg-surface-2 cursor-pointer" data-prompt="Create a multi-tenant isolation layer with scoped contexts, separate vector namespaces, and per-tenant rate limiting">
          Multi-tenant isolation
        </button>
        <button class="example-chip text-xs px-3 py-1.5 rounded-full border border-surface-4 text-neutral-400 bg-surface-2 cursor-pointer" data-prompt="Add a RAG pipeline with hybrid search combining BM25 keyword matching and dense vector similarity">
          RAG + hybrid search
        </button>
      </div>

      <!-- Submit -->
      <div class="mt-4 flex items-center gap-3">
        <button
          id="submit-btn"
          class="btn-glow flex-1 sm:flex-none inline-flex items-center justify-center gap-2 px-6 py-3 bg-accent hover:bg-accent-hover text-white font-semibold text-sm rounded-lg disabled:opacity-40 disabled:cursor-not-allowed"
        >
          <span id="btn-label">Generate Architecture</span>
          <span id="btn-arrow" class="text-base leading-none">&#9654;</span>
          <span id="btn-spinner" class="spinner hidden"></span>
        </button>
        <span class="text-xs text-neutral-600 hidden sm:inline">
          <kbd class="px-1.5 py-0.5 bg-surface-3 rounded text-neutral-500 text-[10px] font-mono">&#8984;Enter</kbd>
        </span>
      </div>
    </section>

    <!-- Output Section -->
    <section id="output-section" class="hidden">
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-2">
          <h2 class="text-sm font-semibold text-neutral-300">Architecture Plan</h2>
          <span id="token-info" class="hidden text-xs text-neutral-600 tabular-nums"></span>
        </div>
        <button
          id="copy-all-btn"
          class="hidden text-xs px-3 py-1.5 rounded-md border border-surface-4 text-neutral-400 bg-surface-2 hover:bg-surface-3 hover:text-neutral-200 transition-colors cursor-pointer"
        >
          Copy All
        </button>
      </div>

      <!-- Loading indicator -->
      <div id="loading-indicator" class="hidden py-8 flex items-center justify-center gap-1">
        <span class="loading-dot"></span>
        <span class="loading-dot"></span>
        <span class="loading-dot"></span>
      </div>

      <!-- Rendered output -->
      <div
        id="output-content"
        class="bg-surface-1 border border-surface-3 rounded-lg p-4 sm:p-6 overflow-y-auto"
        style="max-height: 70vh;"
      ></div>

      <!-- Error notice (appended if stream fails) -->
      <div id="error-notice" class="hidden mt-3 p-3 rounded-lg bg-red-950/30 border border-red-900/50 text-red-300 text-sm"></div>
    </section>

  </main>

  <!-- Footer -->
  <footer class="border-t border-surface-3 py-4 text-center">
    <p class="text-xs text-neutral-600">Powered by CEMAF &mdash; eating its own dog food</p>
  </footer>

  <script>
    // --- DOM refs ---
    const promptInput = document.getElementById('prompt-input');
    const charCount = document.getElementById('char-count');
    const submitBtn = document.getElementById('submit-btn');
    const btnLabel = document.getElementById('btn-label');
    const btnArrow = document.getElementById('btn-arrow');
    const btnSpinner = document.getElementById('btn-spinner');
    const outputSection = document.getElementById('output-section');
    const outputContent = document.getElementById('output-content');
    const loadingIndicator = document.getElementById('loading-indicator');
    const errorNotice = document.getElementById('error-notice');
    const copyAllBtn = document.getElementById('copy-all-btn');
    const tokenInfo = document.getElementById('token-info');

    let isStreaming = false;
    let fullMarkdown = '';

    // --- marked config ---
    marked.setOptions({
      breaks: true,
      gfm: true,
      highlight: function (code, lang) {
        if (lang && hljs.getLanguage(lang)) {
          return hljs.highlight(code, { language: lang }).value;
        }
        return hljs.highlightAuto(code).value;
      },
    });

    // --- Character count ---
    promptInput.addEventListener('input', () => {
      charCount.textContent = promptInput.value.length;
    });

    // --- Example chips ---
    document.querySelectorAll('.example-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        promptInput.value = chip.dataset.prompt;
        promptInput.dispatchEvent(new Event('input'));
        promptInput.focus();
      });
    });

    // --- Keyboard shortcut ---
    promptInput.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
        e.preventDefault();
        if (!isStreaming) submitBtn.click();
      }
    });

    // --- Submit ---
    submitBtn.addEventListener('click', () => {
      const prompt = promptInput.value.trim();
      if (!prompt || isStreaming) return;
      generateArchitecture(prompt);
    });

    // --- Render markdown with copy buttons on code blocks ---
    function renderMarkdown(md) {
      outputContent.innerHTML = marked.parse(md);

      // Wrap pre blocks for copy buttons
      outputContent.querySelectorAll('pre').forEach(pre => {
        if (pre.parentElement.classList.contains('code-block-wrapper')) return;
        const wrapper = document.createElement('div');
        wrapper.className = 'code-block-wrapper';
        pre.parentElement.insertBefore(wrapper, pre);
        wrapper.appendChild(pre);

        const btn = document.createElement('button');
        btn.className = 'code-copy-btn';
        btn.textContent = 'Copy';
        btn.addEventListener('click', () => {
          const code = pre.querySelector('code');
          navigator.clipboard.writeText(code.textContent).then(() => {
            btn.textContent = 'Copied';
            setTimeout(() => { btn.textContent = 'Copy'; }, 1500);
          });
        });
        wrapper.appendChild(btn);
      });
    }

    // --- Smooth auto-scroll ---
    function scrollToBottom() {
      outputContent.scrollTo({ top: outputContent.scrollHeight, behavior: 'smooth' });
    }

    // --- Set loading state ---
    function setLoading(loading) {
      isStreaming = loading;
      submitBtn.disabled = loading;
      btnArrow.classList.toggle('hidden', loading);
      btnSpinner.classList.toggle('hidden', !loading);
      btnLabel.textContent = loading ? 'Generating...' : 'Generate Architecture';
    }

    // --- Main streaming function ---
    async function generateArchitecture(prompt) {
      setLoading(true);
      fullMarkdown = '';
      outputContent.innerHTML = '';
      errorNotice.classList.add('hidden');
      errorNotice.textContent = '';
      copyAllBtn.classList.add('hidden');
      tokenInfo.classList.add('hidden');

      // Show output section
      outputSection.classList.remove('hidden');
      outputSection.classList.add('fade-in-up');
      loadingIndicator.classList.remove('hidden');
      loadingIndicator.style.display = 'flex';

      let receivedFirstToken = false;

      try {
        const response = await fetch('/api/architect', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt }),
        });

        if (!response.ok) {
          const text = await response.text().catch(() => '');
          let message;
          if (response.status === 500 && text.toLowerCase().includes('api_key')) {
            message = 'API key not configured. Set the ANTHROPIC_API_KEY environment variable and restart the server.';
          } else if (response.status === 500) {
            message = `Server error (${response.status}). ${text || 'Check server logs for details.'}`;
          } else {
            message = `Request failed with status ${response.status}. ${text}`;
          }
          throw new Error(message);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop() || '';

          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;

            let data;
            try {
              data = JSON.parse(line.slice(6));
            } catch {
              continue;
            }

            if (data.done) {
              // Show token info if available
              if (data.tokens) {
                tokenInfo.textContent = `${data.tokens} tokens`;
                tokenInfo.classList.remove('hidden');
              }
              continue;
            }

            if (data.error) {
              throw new Error(data.error);
            }

            if (data.content) {
              if (!receivedFirstToken) {
                receivedFirstToken = true;
                loadingIndicator.classList.add('hidden');
                loadingIndicator.style.display = 'none';
              }

              fullMarkdown += data.content;
              renderMarkdown(fullMarkdown);
              scrollToBottom();
            }
          }
        }

        // Done
        copyAllBtn.classList.remove('hidden');

      } catch (err) {
        loadingIndicator.classList.add('hidden');
        loadingIndicator.style.display = 'none';

        let msg = err.message;
        if (err.name === 'TypeError' && msg.includes('fetch')) {
          msg = 'Could not connect to CEMAF server. Make sure it\'s running on port 8420.';
        }

        errorNotice.textContent = msg;
        errorNotice.classList.remove('hidden');

        if (fullMarkdown) {
          // Keep partial output visible
        }
      } finally {
        setLoading(false);
      }
    }

    // --- Copy All ---
    copyAllBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(fullMarkdown).then(() => {
        const orig = copyAllBtn.textContent;
        copyAllBtn.textContent = 'Copied!';
        setTimeout(() => { copyAllBtn.textContent = orig; }, 1500);
      });
    });
  </script>
</body>
</html>
